<script>
var INIT=[
  {id:1,name:'Aleksey',    rating:80},
  {id:2,name:'Maksym',     rating:72},
  {id:3,name:'Victoria A', rating:65},
  {id:4,name:'Vita L',     rating:65},
  {id:5,name:'Victoria T', rating:60},
  {id:6,name:'Alla',       rating:50},
  {id:7,name:'Cleo',       rating:35},
  {id:8,name:'Anna',       rating:20},
];

var db = freshDB();
function freshDB(){
  return{players:INIT.map(function(p){return{id:p.id,name:p.name,rating:p.rating,gamesPlayed:0,wins:0,losses:0};}),sessions:[],nextId:9};
}
function saveDB(){
  if(window._fireSave) window._fireSave(JSON.parse(JSON.stringify(db)));
  try{localStorage.setItem('bmt9',JSON.stringify(db));}catch(e){}
}

var scr='home', ses=null, tab='courts', modal=null, modal_editId=null;

function GP(id){return db.players.find(function(p){return p.id===id;})||{name:'?',rating:50,wins:0,losses:0,gamesPlayed:0};}
function GR(id){return GP(id).rating;}
function GN(id){return GP(id).name;}
function tavg(ids){return ids.reduce(function(s,id){return s+GR(id);},0)/ids.length;}
function ini(n){return n.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);}
function abg(r){return r>=65?'#d1fae5':r>=45?'#fef3c7':'#fee2e2';}
function afg(r){return r>=65?'#065f46':r>=45?'#92400e':'#991b1b';}
function rc(r){return r>=65?'#10b981':r>=45?'#f59e0b':'#ef4444';}
function rbadge(r){return r>=65?'bg-s':r>=45?'bg-w':'bg-d';}
function rlbl(r){return r>=65?'Сильний':r>=45?'Середній':'Початківець';}
function pk(a,b){return [a,b].sort(function(x,y){return x-y;}).join('-');}
function mk(t1,t2){return[[].concat(t1).sort().join(','),[].concat(t2).sort().join(',')].sort().join('|');}

function pickResting(allIds){
  // pick the player who has rested least recently (fairest rotation)
  if(!ses.restQueue || ses.restQueue.length===0) ses.restQueue=allIds.slice();
  // find first in restQueue who is present today
  for(var i=0;i<ses.restQueue.length;i++){
    if(allIds.indexOf(ses.restQueue[i])>=0){
      var picked=ses.restQueue[i];
      ses.restQueue.splice(i,1); // remove from front
      return picked;
    }
  }
  // fallback
  return allIds[0];
}

function scoreCombo(t1,t2,pp,pm){
  var diff=Math.abs(tavg(t1)-tavg(t2));
  var pp2=0;
  if(pp.indexOf(pk(t1[0],t1[1]))>=0)pp2+=15;
  if(pp.indexOf(pk(t2[0],t2[1]))>=0)pp2+=15;
  var mp2=pm.indexOf(mk(t1,t2))>=0?25:0;
  return diff+pp2+mp2;
}

function bestPairFrom4(pool,pp,pm){
  var combos=[
    {t1:[pool[0],pool[1]],t2:[pool[2],pool[3]]},
    {t1:[pool[0],pool[2]],t2:[pool[1],pool[3]]},
    {t1:[pool[0],pool[3]],t2:[pool[1],pool[2]]},
  ];
  var best=combos[0],bestScore=9999;
  for(var i=0;i<combos.length;i++){
    var s=scoreCombo(combos[i].t1,combos[i].t2,pp,pm);
    if(s<bestScore){bestScore=s;best=combos[i];}
  }
  return{team1:best.t1,team2:best.t2,score:bestScore};
}

function makePairings(playerIds,numCourts){
  var pp=ses?ses.prevPairs:[];
  var pm=ses?ses.prevMatches:[];
  var sorted=playerIds.map(function(id){return{id:id,r:GR(id)};}).sort(function(a,b){return b.r-a.r;});
  var allIds=sorted.map(function(p){return p.id;});
  var slots=numCourts*4;
  var activeIds=allIds.slice();
  var waiting=[];
  // if odd number — fairly rotate who sits out
  while(activeIds.length > slots){
    var resting=pickResting(allIds);
    activeIds.splice(activeIds.indexOf(resting),1);
    waiting.push(resting);
  }
  var active=activeIds;
  var courts=[];

  // 1 court or fewer than 8 players — simple sequential split
  if(numCourts===1||active.length<8){
    var n=Math.min(numCourts,Math.floor(active.length/4));
    for(var c=0;c<n;c++){
      var pool=active.slice(c*4,c*4+4);
      courts.push(bestPairFrom4(pool,pp,pm));
    }
    return{courts:courts,waiting:waiting};
  }

  // 2 courts, exactly 8 players — full combinatorial search (35 splits)
  if(numCourts===2&&active.length===8){
    var ids=active.slice(0,8);
    var bestTotal=9999,bestC1=null,bestC2=null;
    for(var a=0;a<8;a++){
      for(var b=a+1;b<8;b++){
        for(var c2=b+1;c2<8;c2++){
          for(var d=c2+1;d<8;d++){
            var g1=[ids[a],ids[b],ids[c2],ids[d]];
            var g2=ids.filter(function(x){return g1.indexOf(x)<0;});
            var c1res=bestPairFrom4(g1,pp,pm);
            var c2res=bestPairFrom4(g2,pp,pm);
            var total=c1res.score+c2res.score;
            if(total<bestTotal){bestTotal=total;bestC1=c1res;bestC2=c2res;}
          }
        }
      }
    }
    courts.push(bestC1);
    courts.push(bestC2);
    return{courts:courts,waiting:waiting};
  }

  // 3 courts (12 players) or other cases — greedy best split per court
  // Try all splits of 12 into 3 groups of 4 is C(12,4)*C(8,4)/6 = 5775 — feasible
  if(numCourts===3&&active.length===12){
    var ids12=active.slice(0,12);
    var bestTotal3=9999,bestCourts3=null;
    // iterate all ways to pick first group of 4 from 12
    for(var a=0;a<12;a++){for(var b=a+1;b<12;b++){for(var c2=b+1;c2<12;c2++){for(var d=c2+1;d<12;d++){
      var g1=[ids12[a],ids12[b],ids12[c2],ids12[d]];
      var rem1=ids12.filter(function(x){return g1.indexOf(x)<0;});
      // pick second group of 4 from remaining 8
      for(var e=0;e<8;e++){for(var f2=e+1;f2<8;f2++){for(var g=f2+1;g<8;g++){for(var h=g+1;h<8;h++){
        var g2=[rem1[e],rem1[f2],rem1[g],rem1[h]];
        var g3=rem1.filter(function(x){return g2.indexOf(x)<0;});
        var r1=bestPairFrom4(g1,pp,pm);
        var r2=bestPairFrom4(g2,pp,pm);
        var r3=bestPairFrom4(g3,pp,pm);
        var tot=r1.score+r2.score+r3.score;
        if(tot<bestTotal3){bestTotal3=tot;bestCourts3=[r1,r2,r3];}
      }}}}
    }}}}
    if(bestCourts3){for(var i=0;i<bestCourts3.length;i++) courts.push(bestCourts3[i]);}
    return{courts:courts,waiting:waiting};
  }

  // fallback for any other combination — sequential
  var nf=Math.min(numCourts,Math.floor(active.length/4));
  for(var cf=0;cf<nf;cf++){
    courts.push(bestPairFrom4(active.slice(cf*4,cf*4+4),pp,pm));
  }
  return{courts:courts,waiting:waiting};
}

function getK(p, margin, total){
  var marginBonus = margin / Math.max(total, 1);
  var baseVet = 1.0 * (1 + marginBonus * 0.5);
  if(!p.isNewcomer) return baseVet;
  // newcomer exits fast-track when: 5+ games played
  // OR their rating has hit the boundary of other players (top or bottom)
  var ratings = db.players.filter(function(x){return !x.isNewcomer && x.gamesPlayed>0;}).map(function(x){return x.rating;});
  var minR = ratings.length ? Math.min.apply(null,ratings) : 20;
  var maxR = ratings.length ? Math.max.apply(null,ratings) : 80;
  var atBoundary = p.rating < minR - 3 || p.rating > maxR + 3;
  if(p.gamesPlayed >= 5 || atBoundary) return baseVet;
  // starts K=10, decays linearly over 5 games
  var decay = p.gamesPlayed / 5;
  var base = 5.0 - (5.0 - 1.0) * decay;
  return base * (1 + marginBonus * 0.5);
}

function applyScore(t1,t2,s1,s2){
  var gap=tavg(t1)-tavg(t2);
  var exp1=1/(1+Math.pow(10,-gap/20));
  var act1=s1>s2?1:0;
  var margin=Math.abs(s1-s2);
  var total=s1+s2;
  var all=[].concat(t1,t2);
  for(var i=0;i<all.length;i++){
    var id=all[i],p=GP(id);
    var inT1=t1.indexOf(id)>=0;
    var act=inT1?act1:1-act1;
    var exp=inT1?exp1:1-exp1;
    var K=getK(p, margin, total);  // read BEFORE incrementing gamesPlayed
    var delta=K*(act-exp);
    p.rating=Math.max(1,Math.min(99,p.rating+delta));
    p.gamesPlayed++;  // increment after K is read
    if(act>0.5)p.wins++;else p.losses++;
    ses.ratingDeltas.push({id:id,delta:delta});
  }
}

function R(){
  var s='';
  if(scr==='home') s=pgHome();
  else if(scr==='session') s=pgSession();
  else if(scr==='stats') s=pgStats();
  document.getElementById('root').innerHTML=s;

  var m='';
  if(modal==='add') m=mAdd();
  else if(modal==='end') m=mEnd();
  else if(modal==='editRating') m=mEditRating();
  document.getElementById('mroot').innerHTML=m;
}

function pgHome(){
  var ps=db.players;
  var rows='';
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    rows+='<div class="prow">'+
      '<input type="checkbox" class="pgchk" value="'+p.id+'" checked style="width:16px;height:16px;cursor:pointer">'+
      '<div class="av" style="background:'+abg(p.rating)+';color:'+afg(p.rating)+'">'+ini(p.name)+'</div>'+
      '<span style="flex:1;font-size:14px">'+p.name+'</span>'+
      '<div class="rbar"><div class="rfill" style="width:'+p.rating+'%;background:'+rc(p.rating)+'"></div></div>'+
      '<span style="font-size:13px;font-weight:600;min-width:26px;text-align:right">'+Math.round(p.rating)+'</span>'+
      '</div>';
  }
  var ranked='';
  var srt=ps.slice().sort(function(a,b){return b.rating-a.rating;});
  for(var j=0;j<srt.length;j++){
    var q=srt[j];
    ranked+='<div class="prow">'+
      '<span style="font-size:12px;color:#888;min-width:18px">'+(j+1)+'</span>'+
      '<div class="av" style="background:'+abg(q.rating)+';color:'+afg(q.rating)+'">'+ini(q.name)+'</div>'+
      '<span style="flex:1;font-size:14px">'+q.name+'</span>'+
      '<span class="badge '+rbadge(q.rating)+'" style="margin-right:6px">'+rlbl(q.rating)+'</span>'+
      '<span style="font-size:14px;font-weight:600">'+Math.round(q.rating)+'</span>'+
      '<button class="btn btn-sm" style="margin-left:6px" onclick="openEditRating('+q.id+')">✎</button>'+
      '<button class="btn btn-sm" style="margin-left:4px" onclick="delP('+q.id+')">✕</button>'+
      '</div>';
  }
  return '<h2>🏸 Бадмінтон</h2>'+
    '<div class="card"><h3>Новий ігровий день</h3>'+
    '<div style="margin-bottom:12px"><div class="slbl">Кількість кортів</div>'+
    '<select id="selC" class="inp">'+
    '<option value="1">1 корт</option><option value="2" selected>2 корти</option><option value="3">3 корти</option>'+
    '</select></div>'+
    '<div class="slbl">Гравці сьогодні</div>'+
    '<div id="chklist">'+rows+'</div>'+
    '<div class="row" style="margin-top:12px;gap:8px">'+
    '<button class="btn btn-primary" onclick="doStart()">▶ Розпочати день</button>'+
    '<button class="btn" onclick="modal=\'add\';R()">+ Новий гравець</button>'+
    '<button class="btn" onclick="scr=\'stats\';R()">Статистика</button>'+
    '</div></div>'+
    '<div class="card"><h3>Рейтинг гравців</h3>'+ranked+'</div>';
}

function doStart(){
  var selEl=document.getElementById('selC');
  var numCourts=selEl?parseInt(selEl.value):2;
  var boxes=document.querySelectorAll('.pgchk');
  var checked=[];
  for(var i=0;i<boxes.length;i++){if(boxes[i].checked)checked.push(parseInt(boxes[i].value));}
  if(checked.length<4){alert('Потрібно мінімум 4 гравці (обрано: '+checked.length+')');return;}
  ses={players:checked,numCourts:numCourts,courts:[],waiting:[],log:[],ratingDeltas:[],prevPairs:[],prevMatches:[],restQueue:checked.slice()};
  var res=makePairings(checked,numCourts);
  ses.courts=res.courts.map(function(c){return{match:c,status:'playing'};});
  ses.waiting=res.waiting;
  scr='session'; tab='courts'; R();
}

function pgSession(){
  var content='';
  if(tab==='courts') content=tabCourts();
  else if(tab==='queue') content=tabQueue();
  else content=tabLog();
  return '<div class="row" style="margin-bottom:1rem;flex-wrap:wrap;gap:6px">'+
    '<h2 style="flex:1">Ігровий день</h2>'+
    '<button class="btn btn-sm btn-warning" onclick="forceReshuffle()">🔀 Решафл</button>'+
    '<button class="btn btn-sm" style="margin-left:4px" onclick="modal=\'end\';R()">Завершити день</button>'+
    '<button class="btn btn-sm" style="margin-left:4px" onclick="scr=\'home\';R()">← Головна</button>'+
    '</div>'+
    '<div class="tbbar">'+
    '<button class="tb'+(tab==='courts'?' on':'')+'" onclick="tab=\'courts\';R()">Корти</button>'+
    '<button class="tb'+(tab==='queue'?' on':'')+'" onclick="tab=\'queue\';R()">Черга ('+ses.waiting.length+')</button>'+
    '<button class="tb'+(tab==='log'?' on':'')+'" onclick="tab=\'log\';R()">Ігри ('+ses.log.length+')</button>'+
    '</div>'+content;
}

function tabCourts(){
  var allDone=ses.courts.length>0;
  for(var i=0;i<ses.courts.length;i++){if(ses.courts[i].status==='playing'){allDone=false;break;}}
  var h='';
  if(allDone&&ses.courts.length>1){
    h+='<div class="banner">'+
      '<span style="flex:1;font-size:14px;font-weight:600">Обидва корти завершили гру!</span>'+
      '<button class="btn btn-success btn-sm" onclick="shuffleAll()">🔀 Шафл всіх '+ses.players.length+'</button>'+
      '</div>';
  }
  for(var ci=0;ci<ses.courts.length;ci++){h+=courtHTML(ses.courts[ci],ci);}
  return h;
}

function courtHTML(c,ci){
  if(!c.match) return '<div class="cblock"><span style="color:#888;font-size:14px">Корт '+(ci+1)+' — очікує</span></div>';
  var t1=c.match.team1,t2=c.match.team2;
  var t1n=t1.map(GN).join(' + '),t2n=t2.map(GN).join(' + ');
  var t1r=Math.round(tavg(t1)),t2r=Math.round(tavg(t2));
  var diff=Math.abs(t1r-t2r);
  var bb=diff<=5?'<span class="badge bg-s">±'+diff+'</span>':diff<=15?'<span class="badge bg-w">±'+diff+'</span>':'<span class="badge bg-d">±'+diff+'</span>';
  if(c.status==='done'){
    var s1=c.result.score1,s2=c.result.score2,wt=s1>s2?1:2;
    var close=Math.abs(s1-s2)<=4;
    var otherDone=true;
    for(var i=0;i<ses.courts.length;i++){if(i!==ci&&ses.courts[i].status!=='done'){otherDone=false;break;}}
    return '<div class="cblock" style="border-color:#86efac">'+
      '<div class="row" style="margin-bottom:.6rem"><span style="font-weight:600">Корт '+(ci+1)+'</span><span class="badge bg-s">Завершено</span>'+bb+'</div>'+
      '<div class="row" style="gap:8px;margin-bottom:.75rem">'+
      '<div class="tbox" style="'+(wt===1?'outline:2px solid #10b981':'')+'">'+'<div style="font-size:11px;color:#888">Команда 1</div><div style="font-size:14px;font-weight:600">'+t1n+'</div><div style="font-size:11px;color:#888">avg '+t1r+'</div></div>'+
      '<div style="font-size:22px;font-weight:700;min-width:52px;text-align:center">'+s1+':'+s2+'</div>'+
      '<div class="tbox" style="'+(wt===2?'outline:2px solid #10b981':'')+'">'+'<div style="font-size:11px;color:#888">Команда 2</div><div style="font-size:14px;font-weight:600">'+t2n+'</div><div style="font-size:11px;color:#888">avg '+t2r+'</div></div>'+
      '</div>'+
      '<div class="slbl">Що далі?</div>'+
      '<div class="row" style="gap:6px;flex-wrap:wrap">'+
      (close?'<button class="btn btn-warning btn-sm" onclick="doRevenge('+ci+')">🔄 Реванш ('+s1+':'+s2+')</button>':'')+
      '<button class="btn btn-sm" onclick="shuffleCourt('+ci+')">🔀 Шафл цього корту</button>'+
      (ses.courts.length>1&&!otherDone?'<button class="btn btn-sm" onclick="waitOther('+ci+')">⏳ Чекати інший корт</button>':'')+
      '</div></div>';
  }
  return '<div class="cblock">'+
    '<div class="row" style="margin-bottom:.6rem"><span style="font-weight:600">Корт '+(ci+1)+'</span><span class="badge bg-i">Грають</span>'+bb+'</div>'+
    '<div class="row" style="gap:8px;margin-bottom:.75rem">'+
    '<div class="tbox"><div style="font-size:11px;color:#888">Команда 1</div><div style="font-size:14px;font-weight:600">'+t1n+'</div><div style="font-size:11px;color:#888">avg '+t1r+'</div></div>'+
    '<span style="font-size:14px;color:#888;font-weight:600">VS</span>'+
    '<div class="tbox"><div style="font-size:11px;color:#888">Команда 2</div><div style="font-size:14px;font-weight:600">'+t2n+'</div><div style="font-size:11px;color:#888">avg '+t2r+'</div></div>'+
    '</div>'+
    '<div class="row" style="gap:6px">'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:11px;color:#888">Т1</span><input class="sinp" type="number" min="0" max="30" id="s1c'+ci+'" placeholder="0"></div>'+
    '<span style="font-size:20px;color:#888;padding-top:18px">:</span>'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:11px;color:#888">Т2</span><input class="sinp" type="number" min="0" max="30" id="s2c'+ci+'" placeholder="0"></div>'+
    '<div style="padding-top:18px"><button class="btn btn-success btn-sm" onclick="doScore('+ci+')">Записати ✓</button></div>'+
    '</div></div>';
}

function tabQueue(){
  if(!ses.waiting.length) return '<div class="card"><p style="color:#888;font-size:14px">Всі гравці на корті.</p></div>';
  var h='<div class="card"><h3>Очікують ('+ses.waiting.length+')</h3>';
  for(var i=0;i<ses.waiting.length;i++){
    var p=GP(ses.waiting[i]);
    h+='<div class="prow"><div class="av" style="background:'+abg(p.rating)+';color:'+afg(p.rating)+'">'+ini(p.name)+'</div>'+
      '<span style="flex:1;font-size:14px">'+p.name+'</span>'+
      '<div class="rbar"><div class="rfill" style="width:'+p.rating+'%;background:'+rc(p.rating)+'"></div></div>'+
      '<span style="font-size:13px;font-weight:600">'+Math.round(p.rating)+'</span>'+
      '<button class="btn btn-sm btn-danger" style="margin-left:8px" onclick="leaveSession('+ses.waiting[i]+')">Пішов</button></div>';
  }
  return h+'</div>';
}

function tabLog(){
  if(!ses.log.length) return '<div class="card"><p style="color:#888;font-size:14px">Ще не зіграно жодної гри.</p></div>';
  var h='';
  for(var i=ses.log.length-1;i>=0;i--){
    var g=ses.log[i],w=g.score1>g.score2?1:2;
    h+='<div class="card" style="padding:.6rem 1rem">'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:2px"><span>Гра '+(i+1)+'</span><span>Корт '+(g.court+1)+'</span></div>'+
      '<div class="row" style="gap:6px">'+
      '<span style="flex:1;font-size:13px;font-weight:'+(w===1?'600':'400')+'">'+g.team1.map(GN).join(' + ')+'</span>'+
      '<span style="font-size:16px;font-weight:700;min-width:42px;text-align:center">'+g.score1+':'+g.score2+'</span>'+
      '<span style="flex:1;font-size:13px;font-weight:'+(w===2?'600':'400')+';text-align:right">'+g.team2.map(GN).join(' + ')+'</span>'+
      '</div></div>';
  }
  return h;
}

function pgStats(){
  var ps=db.players.slice().sort(function(a,b){return b.rating-a.rating;});
  var h='<div class="row" style="margin-bottom:1rem"><h2 style="flex:1">Статистика</h2>'+
    '<button class="btn btn-sm" onclick="scr=\'home\';R()">← Назад</button></div>'+
    '<div class="card"><h3>Всі гравці</h3>';
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    h+='<div class="prow">'+
      '<span style="font-size:12px;color:#888;min-width:18px">'+(i+1)+'</span>'+
      '<div class="av" style="background:'+abg(p.rating)+';color:'+afg(p.rating)+'">'+ini(p.name)+'</div>'+
      '<div style="flex:1"><div style="font-size:14px;font-weight:600">'+p.name+'</div>'+
      '<div style="font-size:12px;color:#888">'+p.wins+'В / '+p.losses+'П · '+p.gamesPlayed+' ігор</div></div>'+
      '<div class="rbar" style="max-width:80px"><div class="rfill" style="width:'+p.rating+'%;background:'+rc(p.rating)+'"></div></div>'+
      '<span style="font-size:15px;font-weight:700;min-width:28px;text-align:right">'+Math.round(p.rating)+'</span></div>';
  }
  h+='</div>';
  if(db.sessions.length){
    h+='<div class="card"><h3>Попередні дні ('+db.sessions.length+')</h3>';
    for(var j=db.sessions.length-1;j>=0;j--){
      var s=db.sessions[j];
      h+='<div class="prow"><span style="flex:1">'+s.date+'</span><span style="color:#888">'+s.gamesCount+' ігор</span></div>';
    }
    h+='</div>';
  }
  return h;
}

function mAdd(){
  var avg=Math.round(db.players.reduce(function(s,p){return s+p.rating;},0)/Math.max(db.players.length,1));
  return '<div class="mwrap" onclick="if(event.target===this){modal=null;R()}"><div class="modal">'+
    '<h3 style="margin-bottom:1rem">Новий гравець</h3>'+
    '<div style="margin-bottom:10px"><div class="slbl">Ім\'я</div><input type="text" id="iname" class="inp" style="width:100%" placeholder="Введіть ім\'я"></div>'+
    '<div style="margin-bottom:14px"><div class="slbl">Рейтинг 0–100 (порожньо = '+avg+')</div><input type="number" id="irating" class="inp" min="0" max="100" style="width:100%" placeholder="'+avg+'"></div>'+
    '<div id="merr" style="color:#991b1b;font-size:13px;min-height:16px;margin-bottom:8px"></div>'+
    '<div class="row" style="gap:8px"><button class="btn btn-primary" onclick="confirmAdd()">Додати</button><button class="btn" onclick="modal=null;R()">Скасувати</button></div>'+
    '</div></div>';
}

function mEditRating(){
  var p=GP(modal_editId);
  return '<div class="mwrap" onclick="if(event.target===this){modal=null;R()}"><div class="modal">'+
    '<h3 style="margin-bottom:.75rem">Редагувати рейтинг</h3>'+
    '<div style="margin-bottom:6px;font-size:14px;font-weight:600">'+p.name+'</div>'+
    '<div style="font-size:13px;color:#888;margin-bottom:12px">Поточний рейтинг: '+Math.round(p.rating)+' | Ігор: '+p.gamesPlayed+' | '+p.wins+'В/'+p.losses+'П</div>'+
    '<div style="margin-bottom:14px"><div class="slbl">Новий рейтинг (0–100)</div>'+
    '<input type="number" id="inp-edit-rating" class="inp" min="0" max="100" style="width:100%" placeholder="'+Math.round(p.rating)+'">'+
    '</div>'+
    '<div id="edit-err" style="color:#991b1b;font-size:13px;min-height:16px;margin-bottom:8px"></div>'+
    '<div class="row" style="gap:8px">'+
    '<button class="btn btn-primary" onclick="confirmEditRating()">Зберегти</button>'+
    '<button class="btn" onclick="modal=null;R()">Скасувати</button>'+
    '</div></div></div>';
}

function mEnd(){
  var stats={};
  for(var i=0;i<ses.players.length;i++)stats[ses.players[i]]={w:0,l:0};
  for(var i=0;i<ses.log.length;i++){
    var g=ses.log[i];
    var win=g.score1>g.score2?g.team1:g.team2,los=g.score1>g.score2?g.team2:g.team1;
    for(var j=0;j<win.length;j++)if(stats[win[j]])stats[win[j]].w++;
    for(var j=0;j<los.length;j++)if(stats[los[j]])stats[los[j]].l++;
  }
  var deltas={};
  for(var i=0;i<ses.players.length;i++)deltas[ses.players[i]]=0;
  for(var i=0;i<ses.ratingDeltas.length;i++){var d=ses.ratingDeltas[i];if(d.id in deltas)deltas[d.id]+=d.delta;}
  var rows='';
  for(var i=0;i<ses.players.length;i++){
    var id=ses.players[i],p=GP(id),s=stats[id]||{w:0,l:0},d=deltas[id]||0;
    rows+='<div class="prow">'+
      '<div class="av" style="background:'+abg(p.rating)+';color:'+afg(p.rating)+'">'+ini(p.name)+'</div>'+
      '<span style="flex:1;font-size:14px">'+p.name+'</span>'+
      '<span style="font-size:13px;margin-right:6px">'+s.w+'В/'+s.l+'П</span>'+
      '<span class="'+(d>=0?'du':'dd')+'">'+(d>=0?'+':'')+Math.round(d)+'</span>'+
      '<span style="font-size:14px;font-weight:600;margin-left:6px">'+Math.round(p.rating)+'</span></div>';
  }
  return '<div class="mwrap"><div class="modal">'+
    '<h3 style="margin-bottom:.75rem">Підсумок дня ('+ses.log.length+' ігор)</h3>'+
    '<div style="max-height:300px;overflow-y:auto">'+rows+'</div>'+
    '<div class="row" style="gap:8px;margin-top:1rem">'+
    '<button class="btn btn-primary" onclick="confirmEnd()">Зберегти і завершити</button>'+
    '<button class="btn" onclick="modal=null;R()">Продовжити</button>'+
    '</div></div></div>';
}

function doScore(ci){
  var c=ses.courts[ci];
  if(!c||c.status==='done')return;
  var el1=document.getElementById('s1c'+ci),el2=document.getElementById('s2c'+ci);
  var s1=parseInt(el1.value),s2=parseInt(el2.value);
  if(isNaN(s1)||isNaN(s2)||s1<0||s2<0){alert('Введіть коректний рахунок');return;}
  if(s1===s2){alert('Нічия неможлива');return;}
  if(s1===0&&s2===0){alert('Рахунок 0:0?');return;}
  var t1=c.match.team1,t2=c.match.team2;
  applyScore(t1,t2,s1,s2);
  ses.log.push({court:ci,team1:t1,team2:t2,score1:s1,score2:s2});
  ses.prevPairs.push(pk(t1[0],t1[1])); ses.prevPairs.push(pk(t2[0],t2[1]));
  ses.prevMatches.push(mk(t1,t2));
  ses.courts[ci]={match:c.match,status:'done',result:{score1:s1,score2:s2}};
  // add finished players to waiting pool
  var finT=[].concat(t1,t2);
  for(var fi=0;fi<finT.length;fi++){if(ses.waiting.indexOf(finT[fi])<0)ses.waiting.push(finT[fi]);}
  saveDB(); R();
}

function doRevenge(ci){ses.courts[ci]={match:ses.courts[ci].match,status:'playing'};R();}
function shuffleCourt(ci){
  var pool=[].concat(ses.courts[ci].match.team1,ses.courts[ci].match.team2);
  var res=makePairings(pool,1);
  if(res.courts.length)ses.courts[ci]={match:res.courts[0],status:'playing'};
  R();
}
function waitOther(ci){
  var ids=[].concat(ses.courts[ci].match.team1,ses.courts[ci].match.team2);
  for(var i=0;i<ids.length;i++){if(ses.waiting.indexOf(ids[i])<0)ses.waiting.push(ids[i]);}
  ses.courts[ci]={match:null,status:'waiting'};R();
}
function shuffleAll(){
  var res=makePairings(ses.waiting,ses.numCourts);
  ses.courts=res.courts.map(function(c){return{match:c,status:'playing'};});
  ses.waiting=res.waiting; R();
}
function confirmAdd(){
  var name=document.getElementById('iname').value.trim();
  var rRaw=document.getElementById('irating').value;
  var err=document.getElementById('merr');
  if(!name){err.textContent="Введіть ім'я";return;}
  if(db.players.find(function(p){return p.name.toLowerCase()===name.toLowerCase();})){err.textContent='Такий гравець вже є';return;}
  var avg=Math.round(db.players.reduce(function(s,p){return s+p.rating;},0)/Math.max(db.players.length,1));
  var isNew=!rRaw;
  var r=rRaw?Math.max(0,Math.min(100,parseFloat(rRaw))):avg;
  if(isNaN(r)){r=avg;isNew=true;}
  db.players.push({id:db.nextId++,name:name,rating:r,gamesPlayed:0,wins:0,losses:0,isNewcomer:isNew});
  saveDB(); modal=null; R();
}
function leaveSession(id){
  if(!confirm('Гравець '+GN(id)+' покидає гру?')) return;
  // remove from session players list
  ses.players = ses.players.filter(function(x){return x!==id;});
  // remove from waiting
  ses.waiting = ses.waiting.filter(function(x){return x!==id;});
  // remove from restQueue
  if(ses.restQueue) ses.restQueue = ses.restQueue.filter(function(x){return x!==id;});
  // if player is on a court — free the court, put partner in waiting
  for(var ci=0;ci<ses.courts.length;ci++){
    var c=ses.courts[ci];
    if(!c.match) continue;
    var allOnCourt=[].concat(c.match.team1,c.match.team2);
    if(allOnCourt.indexOf(id)>=0){
      // put remaining 3 players in waiting
      var remaining=allOnCourt.filter(function(x){return x!==id;});
      for(var i=0;i<remaining.length;i++){
        if(ses.waiting.indexOf(remaining[i])<0) ses.waiting.push(remaining[i]);
      }
      ses.courts[ci]={match:null,status:'waiting'};
    }
  }
  // reshuffle with remaining players
  var res=makePairings(ses.waiting,ses.numCourts);
  ses.courts=res.courts.map(function(c){return{match:c,status:'playing'};});
  ses.waiting=res.waiting;
  tab='courts'; R();
}

function forceReshuffle(){
  // collect all players currently in session (on courts + waiting)
  var all=ses.waiting.slice();
  for(var ci=0;ci<ses.courts.length;ci++){
    var c=ses.courts[ci];
    if(c.match){
      var players=[].concat(c.match.team1,c.match.team2);
      for(var i=0;i<players.length;i++){
        if(all.indexOf(players[i])<0) all.push(players[i]);
      }
    }
  }
  var res=makePairings(all,ses.numCourts);
  ses.courts=res.courts.map(function(c){return{match:c,status:'playing'};});
  ses.waiting=res.waiting;
  tab='courts'; R();
}

function delP(id){
  if(!confirm('Видалити?'))return;
  db.players=db.players.filter(function(p){return p.id!==id;});
  saveDB(); R();
}
function openEditRating(id){
  var p=GP(id);
  modal='editRating';
  modal_editId=id;
  R();
  var inp=document.getElementById('inp-edit-rating');
  if(inp) inp.value=Math.round(p.rating);
}
function confirmEditRating(){
  var inp=document.getElementById('inp-edit-rating');
  var err=document.getElementById('edit-err');
  var val=parseFloat(inp.value);
  if(isNaN(val)||val<0||val>100){err.textContent='Введіть число від 0 до 100';return;}
  var p=GP(modal_editId);
  p.rating=val;
  p.isNewcomer=false; // manual edit = treated as veteran from now
  saveDB(); modal=null; modal_editId=null; R();
}
function confirmEnd(){
  db.sessions.push({date:new Date().toLocaleDateString('uk-UA'),gamesCount:ses.log.length});
  saveDB(); ses=null; modal=null; scr='home'; R();
}

// async init — load from Firebase, fallback to localStorage
(async function(){
  var loaded = null;
  if(window._fireLoad){
    loaded = await window._fireLoad();
  }
  if(!loaded){
    try{var r=localStorage.getItem('bmt9');if(r)loaded=JSON.parse(r);}catch(e){}
  }
  if(loaded && loaded.players && loaded.players.length){
    db = loaded;
    // ensure new fields exist for old records
    for(var i=0;i<db.players.length;i++){
      if(db.players[i].gamesPlayed===undefined) db.players[i].gamesPlayed=0;
      if(db.players[i].wins===undefined) db.players[i].wins=0;
      if(db.players[i].losses===undefined) db.players[i].losses=0;
    }
    if(!db.sessions) db.sessions=[];
    if(!db.nextId) db.nextId=db.players.length+1;
  }
  document.getElementById('loading').style.display='none';
  R();
})();
</script>
