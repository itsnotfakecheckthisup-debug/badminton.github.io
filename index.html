<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuket Badminton Pro v6.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-court { border-top: 6px solid #2563eb; }
        .stat-badge { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 8px; }
        .win { background: #dcfce7; color: #166534; }
        .loss { background: #fee2e2; color: #991b1b; }
        input:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; border: none; }
        .btn-action { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .btn-action:hover { background: #f9fafb; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-gray-50 p-4 md:p-8 text-gray-900">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-3xl font-black text-gray-800 uppercase italic tracking-tighter">Phuket <span class="text-blue-600">Badminton</span></h1>
                <div id="session-status" class="mt-2 text-[10px] font-black uppercase tracking-widest italic"></div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="session-btn" onclick="toggleSession()" class="bg-green-600 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase">Розпочати</button>
                <button onclick="globalReshuffle()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase italic">Мікс Всіх (8)</button>
                <button onclick="finalizeSession()" class="bg-gray-800 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase">Закрити день</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3 space-y-6" id="courts-root"></div>
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                    <h2 class="text-[10px] font-black mb-4 uppercase italic text-gray-400 tracking-widest text-center">🏆 Рейтинг (20-80)</h2>
                    <div id="leaderboard" class="space-y-2"></div>
                </div>
                <button onclick="copyRanking()" class="w-full py-4 bg-white border border-gray-200 text-gray-400 rounded-2xl text-[10px] font-bold uppercase hover:bg-gray-100 transition">Експорт в Telegram</button>
            </div>
        </div>

        <div class="mt-12">
            <h2 class="text-[10px] font-black mb-4 uppercase italic text-gray-400 tracking-widest">📋 Останні матчі</h2>
            <div id="game-history" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

<script>
// ТУТ ТОЧНО ШКАЛА 20-80
const initialPlayers = [
    { id: 1, name: 'Aleksey', rating: 80, wins: 0, losses: 0 },
    { id: 2, name: 'Maksym', rating: 72, wins: 0, losses: 0 },
    { id: 3, name: 'Victoria Admin', rating: 65, wins: 0, losses: 0 },
    { id: 4, name: 'Вита Лебедева', rating: 65, wins: 0, losses: 0 },
    { id: 5, name: 'Victoria Topalova', rating: 60, wins: 0, losses: 0 },
    { id: 6, name: 'Alla Meh', rating: 50, wins: 0, losses: 0 },
    { id: 7, name: 'Cleo', rating: 35, wins: 0, losses: 0 },
    { id: 8, name: 'Anna Sytenko', rating: 20, wins: 0, losses: 0 }
];

// Змінено назву ключа 'pb_v7_final', щоб стерти старі 2000-рейтинги з пам'яті браузера
let players = JSON.parse(localStorage.getItem('pb_v7_final_players')) || initialPlayers;
let history = JSON.parse(localStorage.getItem('pb_v7_final_history')) || [];
let isSessionActive = JSON.parse(localStorage.getItem('pb_v7_final_session')) || false;
let lastPairs = []; 
let courtState = { 1: { teamA: [], teamB: [], isLocked: false }, 2: { teamA: [], teamB: [], isLocked: false } };

function save() {
    localStorage.setItem('pb_v7_final_players', JSON.stringify(players));
    localStorage.setItem('pb_v7_final_history', JSON.stringify(history));
    localStorage.setItem('pb_v7_final_session', JSON.stringify(isSessionActive));
    renderLeaderboard();
    renderHistory();
}

function toggleSession() {
    isSessionActive = !isSessionActive;
    if (isSessionActive) { players.forEach(p => { p.wins = 0; p.losses = 0; }); history = []; }
    updateUI(); save();
}

function finalizeSession() {
    if (!confirm("Завершити день? Статистика W/L обнулиться, рейтинг збережеться.")) return;
    isSessionActive = false;
    players.forEach(p => { p.wins = 0; p.losses = 0; });
    history = [];
    save();
    updateUI();
}

function globalReshuffle() {
    let bestConfig = null;
    let minDiff = Infinity;
    for (let i = 0; i < 500; i++) {
        let pool = shuffleArray(players);
        let pairs = [[pool[0], pool[1]], [pool[2], pool[3]], [pool[4], pool[5]], [pool[6], pool[7]]];
        let sums = pairs.map(p => p[0].rating + p[1].rating);
        let diff = Math.abs(sums[0] - sums[1]) + Math.abs(sums[2] - sums[3]);
        let pairKeys = pairs.map(p => p.map(x => x.id).sort().join('-'));
