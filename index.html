<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuket Badminton Pro v6.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-court { border-top: 6px solid #2563eb; }
        .stat-badge { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 8px; }
        .win { background: #dcfce7; color: #166534; }
        .loss { background: #fee2e2; color: #991b1b; }
        input:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; border: none; }
        .btn-action { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .btn-action:hover { background: #f9fafb; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-gray-50 p-4 md:p-8 text-gray-900">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-3xl font-black text-gray-800 uppercase italic tracking-tighter">Phuket <span class="text-blue-600">Badminton</span></h1>
                <div id="session-status" class="mt-2 text-[10px] font-black uppercase tracking-widest italic"></div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="session-btn" onclick="toggleSession()" class="bg-green-600 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase">Розпочати</button>
                <button onclick="globalReshuffle()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase italic">Мікс Всіх (8)</button>
                <button onclick="finalizeSession()" class="bg-gray-800 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase">Закрити день</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3 space-y-6" id="courts-root"></div>
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                    <h2 class="text-[10px] font-black mb-4 uppercase italic text-gray-400 tracking-widest text-center">🏆 Рейтинг</h2>
                    <div id="leaderboard" class="space-y-2"></div>
                </div>
                <button onclick="copyRanking()" class="w-full py-4 bg-white border border-gray-200 text-gray-400 rounded-2xl text-[10px] font-bold uppercase hover:bg-gray-100 transition">Експорт в Telegram</button>
            </div>
        </div>

        <div class="mt-12">
            <h2 class="text-[10px] font-black mb-4 uppercase italic text-gray-400 tracking-widest">📋 Останні матчі</h2>
            <div id="game-history" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

<script>
// Твої гравці з фіксованими стартовими рейтингами
const initialPlayers = [
    { id: 1, name: 'Aleksey', rating: 1550, wins: 0, losses: 0 },
    { id: 2, name: 'Maksym', rating: 1500, wins: 0, losses: 0 },
    { id: 3, name: 'Victoria Admin', rating: 1450, wins: 0, losses: 0 },
    { id: 4, name: 'Вита Лебедева', rating: 1450, wins: 0, losses: 0 },
    { id: 5, name: 'Victoria Topalova', rating: 1400, wins: 0, losses: 0 },
    { id: 6, name: 'Alla Meh', rating: 1350, wins: 0, losses: 0 },
    { id: 7, name: 'Cleo', rating: 1200, wins: 0, losses: 0 },
    { id: 8, name: 'Anna Sytenko', rating: 1100, wins: 0, losses: 0 }
];

let players = JSON.parse(localStorage.getItem('pb_v6_players')) || initialPlayers;
let history = JSON.parse(localStorage.getItem('pb_v6_history')) || [];
let lastPairs = []; 
let isSessionActive = JSON.parse(localStorage.getItem('pb_v6_session')) || false;
let courtState = { 1: { teamA: [], teamB: [], isLocked: false }, 2: { teamA: [], teamB: [], isLocked: false } };

function save() {
    localStorage.setItem('pb_v6_players', JSON.stringify(players));
    localStorage.setItem('pb_v6_history', JSON.stringify(history));
    localStorage.setItem('pb_v6_session', JSON.stringify(isSessionActive));
    renderLeaderboard();
    renderHistory();
}

function toggleSession() {
    isSessionActive = !isSessionActive;
    if (isSessionActive) { 
        players.forEach(p => { p.wins = 0; p.losses = 0; }); 
        history = []; 
    }
    updateUI(); save();
}

function finalizeSession() {
    if (!confirm("Завершити ігровий день? Поточний рейтинг буде збережено як основний.")) return;
    isSessionActive = false;
    save();
    alert("День завершено. Рейтинги збережені!");
    updateUI();
}

function globalReshuffle() {
    let bestConfig = null;
    let minDiff = Infinity;
    for (let i = 0; i < 500; i++) {
        let pool = shuffleArray(players);
        let pairs = [[pool[0], pool[1]], [pool[2], pool[3]], [pool[4], pool[5]], [pool[6], pool[7]]];
        let sums = pairs.map(p => p[0].rating + p[1].rating);
        let diff = Math.abs(sums[0] - sums[1]) + Math.abs(sums[2] - sums[3]);
        let pairKeys = pairs.map(p => p.map(x => x.id).sort().join('-'));
        let hasRecentDuplicate = pairKeys.some(key => lastPairs.includes(key));
        if (diff < minDiff && !hasRecentDuplicate) { minDiff = diff; bestConfig = pairs; }
    }
    if (bestConfig) {
        courtState[1] = { teamA: bestConfig[0], teamB: bestConfig[1], isLocked: false };
        courtState[2] = { teamA: bestConfig[2], teamB: bestConfig[3], isLocked: false };
        let currentKeys = bestConfig.map(p => p.map(x => x.id).sort().join('-'));
        lastPairs = [...currentKeys, ...lastPairs].slice(0, 16);
    }
    renderAll();
}

function shuffleCourt(cNum) {
    let pList = [...courtState[cNum].teamA, ...courtState[cNum].teamB];
    let bestLocal = null;
    let minDiff = Infinity;
    for (let i = 0; i < 100; i++) {
        let pool = shuffleArray(pList);
        let diff = Math.abs((pool[0].rating + pool[1].rating) - (pool[2].rating + pool[3].rating));
        let keyA = [pool[0].id, pool[1].id].sort().join('-');
        if (diff < minDiff && !lastPairs.includes(keyA)) { minDiff = diff; bestLocal = pool; }
    }
    if (bestLocal) {
        courtState[cNum] = { teamA: [bestLocal[0], bestLocal[1]], teamB: [bestLocal[2], bestLocal[3]], isLocked: false };
        lastPairs.push([bestLocal[0].id, bestLocal[1].id].sort().join('-'));
    }
    renderCourt(cNum);
}

function submitScore(cNum) {
    if (!isSessionActive) return alert("Спочатку натисніть РОЗПОЧАТИ");
    const sA = parseInt(document.getElementById(`sA_${cNum}`).value);
    const sB = parseInt(document.getElementById(`sB_${cNum}`).value);
    if (isNaN(sA) || isNaN(sB)) return;

    const state = courtState[cNum];
    const avgA = (state.teamA[0].rating + state.teamA[1].rating) / 2;
    const avgB = (state.teamB[0].rating + state.teamB[1].rating) / 2;

    const expectedA = 1 / (1 + Math.pow(10, (avgB - avgA) / 400));
    const actualA = sA > sB ? 1 : (sA === sB ? 0.5 : 0);
    const change = 32 * (actualA - expectedA);

    [...state.teamA, ...state.teamB].forEach(pRef => {
        let p = players.find(x => x.id === pRef.id);
        let isTeamA = state.teamA.some(x => x.id === pRef.id);
        p.rating += isTeamA ? change : -change;
        if (isTeamA) { if (sA > sB) p.wins++; else if (sB > sA) p.losses++; }
        else { if (sB > sA) p.wins++; else if (sA > sB) p.losses++; }
    });

    history.unshift({ time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), court: cNum, teamA: `${state.teamA[0].name}/${state.teamA[1].name}`, teamB: `${state.teamB[0].name}/${state.teamB[1].name}`, score: `${sA}:${sB}` });
    courtState[cNum].isLocked = true;
    save(); renderCourt(cNum);
}

function renderCourt(num) {
    const container = document.getElementById(`court-card-${num}`);
    const state = courtState[num];
    if (!container || !state.teamA.length) return;
    
    // Округлення до цілого для відображення
    const sumA = (state.teamA[0].rating + state.teamA[1].rating).toFixed(0);
    const sumB = (state.teamB[0].rating + state.teamB[1].rating).toFixed(0);

    container.innerHTML = `
        <div class="bg-gray-900 px-6 py-2 flex justify-between items-center"><span class="text-white text-[10px] font-black uppercase tracking-widest italic">КОРТ ${num}</span></div>
        <div class="p-6">
            <div class="flex flex-col lg:flex-row items-center gap-4">
                <div class="flex-1 w-full p-4 bg-blue-50/50 rounded-2xl text-center"><div class="font-bold text-sm text-blue-900">${state.teamA[0].name} + ${state.teamA[1].name}</div><div class="text-[9px] font-black text-blue-400 mt-1 uppercase italic tracking-tighter">СУМА: ${sumA}</div></div>
                <div class="font-black text-gray-200">VS</div>
                <div class="flex-1 w-full p-4 bg-orange-50/50 rounded-2xl text-center"><div class="font-bold text-sm text-orange-900">${state.teamB[0].name} + ${state.teamB[1].name}</div><div class="text-[9px] font-black text-orange-400 mt-1 uppercase italic tracking-tighter">СУМА: ${sumB}</div></div>
                <div class="flex gap-2">
                    <input type="number" id="sA_${num}" placeholder="0" ${state.isLocked ? 'disabled' : ''} class="w-12 h-12 bg-gray-100 rounded-xl text-center font-black text-lg outline-none">
                    <input type="number" id="sB_${num}" placeholder="0" ${state.isLocked ? 'disabled' : ''} class="w-12 h-12 bg-gray-100 rounded-xl text-center font-black text-lg outline-none">
                    ${!state.isLocked ? `<button onclick="submitScore(${num})" class="bg-black text-white px-4 rounded-xl font-black italic uppercase text-[10px]">OK</button>` : `<div class="w-10 h-10 flex items-center justify-center text-green-500">✅</div>`}
                </div>
            </div>
            ${state.isLocked ? `
            <div class="mt-4 pt-4 border-t border-dashed border-gray-100 flex justify-end gap-2 animate-in fade-in">
                <button onclick="courtState[${num}].isLocked=false; renderCourt(${num})" class="btn-action px-3 py-1.5 rounded-lg text-[9px] font-black uppercase text-gray-500">🔄 Реванш</button>
                <button onclick="shuffleCourt(${num})" class="btn-action px-3 py-1.5 rounded-lg text-[9px] font-black uppercase text-blue-600">🔀 Мікс корту</button>
            </div>` : ''}
        </div>
    `;
}

// Допоміжні функції
function shuffleArray(arr) { let a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderAll() { const root = document.getElementById('courts-root'); root.innerHTML = '<div id="court-card-1" class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden mb-6 active-court"></div><div id="court-card-2" class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden mb-6 active-court"></div>'; renderCourt(1); renderCourt(2); }
function updateUI() { 
    const btn = document.getElementById('session-btn');
    const status = document.getElementById('session-status');
    btn.innerText = isSessionActive ? "ЗАКРИТИ ГРУ" : "РОЗПОЧАТИ";
    btn.className = isSessionActive ? "bg-red-600 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase" : "bg-green-600 text-white px-4 py-3 rounded-xl font-black shadow-lg text-xs uppercase";
    status.innerHTML = isSessionActive ? '<span class="text-green-500 animate-pulse">● LIVE SESSION</span>' : '<span class="text-gray-300">Standby</span>';
}
function renderLeaderboard() {
    const list = document.getElementById('leaderboard');
    const sorted = [...players].sort((a, b) => b.rating - a.rating);
    list.innerHTML = sorted.map((p, i) => `
        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border border-white">
            <span class="text-[11px] font-bold text-gray-700">${i+1}. ${p.name}</span>
            <div class="text-right">
                <div class="text-[11px] font-black text-blue-600">${p.rating.toFixed(0)}</div>
                <div class="flex gap-1 mt-1"><span class="stat-badge win">${p.wins}W</span><span class="stat-badge loss">${p.losses}L</span></div>
            </div>
        </div>`).join('');
}
function renderHistory() {
    const root = document.getElementById('game-history');
    root.innerHTML = history.slice(0, 9).map(g => `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-[10px]"><div class="flex justify-between text-gray-400 mb-2 font-bold uppercase tracking-widest"><span>${g.time} — К${g.court}</span></div><div class="flex justify-between items-center"><div class="w-2/5 text-right font-bold truncate">${g.teamA}</div><div class="px-2 bg-gray-900 text-white rounded font-black mx-1 text-xs">${g.score}</div><div class="w-2/5 text-left font-bold truncate">${g.teamB}</div></div></div>`).join('');
}
function copyRanking() {
    let txt = `🏸 PHUKET RANKING:\n\n` + [...players].sort((a,b) => b.rating - a.rating).map((p,i) => `${i+1}. ${p.name}: ${p.rating.toFixed(0)}`).join('\n');
    navigator.clipboard.writeText(txt).then(() => alert("Рейтинг скопійовано!"));
}

updateUI(); renderLeaderboard(); renderHistory(); globalReshuffle();
</script>
</body>
</html>
